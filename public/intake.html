<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Service Request</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,0.10);width:100%;max-width:540px;overflow:hidden}
.card-header{background:#0f1923;padding:24px 28px;color:#fff}
.card-header h1{font-size:20px;font-weight:700;margin-bottom:4px}
.card-header p{font-size:13px;color:#8a9bb0}
.card-body{padding:28px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:#4a5568;margin-bottom:5px}
.req{color:#ef4444}
.form-input{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#1a202c;outline:none;background:#fff}
.form-input:focus{border-color:#1e6fff;box-shadow:0 0 0 3px rgba(30,111,255,0.08)}
textarea.form-input{resize:vertical;min-height:80px}
select.form-input{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;border:none;background:#1e6fff;color:#fff;cursor:pointer;font-size:14px;font-weight:600;width:100%;justify-content:center;transition:background 0.15s}
.btn:hover{background:#1558d6}
.btn:disabled{background:#93c5fd;cursor:not-allowed}
.success{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:24px;text-align:center;display:none}
.success i{font-size:40px;color:#22c55e;margin-bottom:12px;display:block}
.success h2{font-size:18px;font-weight:700;color:#15803d;margin-bottom:6px}
.success p{font-size:13px;color:#166534}
.error-msg{background:#fef2f2;color:#dc2626;font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1 id="biz-name">FieldPro</h1>
    <p>Submit a service request and we'll get back to you shortly.</p>
  </div>
  <div class="card-body">
    <div class="error-msg" id="err-msg"></div>
    <div id="form-wrap">
      <div id="dynamic-fields"></div>
      <button class="btn" onclick="submitForm()" id="submit-btn"><i class="ti ti-send"></i> Submit Request</button>
    </div>
    <div class="success" id="success-box">
      <i class="ti ti-circle-check"></i>
      <h2>Request Submitted!</h2>
      <p id="success-msg">We've received your request and will contact you shortly to confirm your appointment.</p>
    </div>
  </div>
</div>

<script>
let formFields = [];

async function loadForm() {
  try {
    const [fields, settings] = await Promise.all([
      fetch('/api/form-fields').then(r => r.json()),
      fetch('/api/settings').then(r => r.json()).catch(() => ({}))
    ]);
    formFields = fields;
    if (settings.business_name) document.getElementById('biz-name').textContent = settings.business_name + ' — Service Request';
    renderFields(fields);
  } catch(e) {
    document.getElementById('err-msg').textContent = 'Could not load form. Please try again.';
    document.getElementById('err-msg').style.display = 'block';
  }
}

function renderFields(fields) {
  const wrap = document.getElementById('dynamic-fields');
  wrap.innerHTML = fields.map(f => {
    const req = f.required ? 'required' : '';
    const reqMark = f.required ? '<span class="req">*</span>' : '';
    let inp = '';
    if (f.field_type === 'textarea') inp = `<textarea class="form-input" id="ff-${f.id}" placeholder="Enter ${f.label.toLowerCase()}" ${req}></textarea>`;
    else if (f.field_type === 'select') inp = `<select class="form-input" id="ff-${f.id}" ${req}><option value="">Select...</option>${(f.options||[]).map(o=>`<option>${o}</option>`).join('')}</select>`;
    else if (f.field_type === 'checkbox') inp = `<label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="ff-${f.id}" ${req}> ${f.label}</label>`;
    else inp = `<input type="${f.field_type === 'phone' ? 'tel' : f.field_type}" class="form-input" id="ff-${f.id}" placeholder="Enter ${f.label.toLowerCase()}" ${req}>`;
    return `<div class="form-group"><label class="form-label">${f.label} ${reqMark}</label>${inp}</div>`;
  }).join('');
}

async function submitForm() {
  const btn = document.getElementById('submit-btn');
  const errBox = document.getElementById('err-msg');
  errBox.style.display = 'none';

  // Collect values
  const data = {};
  for (const f of formFields) {
    const el = document.getElementById('ff-' + f.id);
    if (!el) continue;
    const val = f.field_type === 'checkbox' ? el.checked : el.value;
    if (f.required && !val) {
      errBox.textContent = `Please fill in "${f.label}"`;
      errBox.style.display = 'block';
      el.focus();
      return;
    }
    data[f.label] = val;
  }

  btn.innerHTML = '<div class="spinner"></div> Submitting...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || 'Submission failed');
    document.getElementById('form-wrap').style.display = 'none';
    const successBox = document.getElementById('success-box');
    successBox.style.display = 'block';
    if (result.job_id) document.getElementById('success-msg').textContent = `Your ticket ${result.job_id} has been created. We will contact you shortly to confirm your appointment.`;
  } catch(e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
    btn.innerHTML = '<i class="ti ti-send"></i> Submit Request';
    btn.disabled = false;
  }
}

loadForm();
</script>
</body>
</html>
